<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHAHA - Nền tảng Quảng cáo Bán lẻ Tối giản</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { background-color: #F5F4F0; color: #1a1a1a; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .serif { font-family: 'Playfair Display', serif; }
        .product-card { transition: opacity 0.4s ease, transform 0.4s ease; background: #fff; padding: 16px; display: flex; flex-direction: column; cursor: pointer; }
        .product-card:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.04); transform: translateY(-4px); }
        .sponsored-badge { 
            position: absolute; top: 24px; left: 24px; background: rgba(255,255,255,0.9);
            border: 1px solid #1a1a1a; padding: 4px 8px; font-size: 0.65rem; 
            letter-spacing: 0.05em; text-transform: uppercase; font-weight: 500;
        }
        .hero-banner { display: none; width: 100%; height: 500px; position: relative; margin-bottom: 3rem; overflow: hidden; }
        .hero-banner.active { display: block; }
        .hero-banner video { width: 100%; height: 100%; object-fit: cover; }
        .hero-banner:hover { opacity: 0.95; transition: opacity 0.3s; }

        .toggle-checkbox:checked { right: 0; border-color: #1a1a1a; }
        .toggle-checkbox:checked + .toggle-label { background-color: #1a1a1a; }
        .toggle-checkbox:checked + .toggle-label:after { transform: translateX(100%); border-color: white; }
        
        #cart-sidebar { transition: transform 0.3s ease-in-out; transform: translateX(100%); }
        #cart-sidebar.open { transform: translateX(0); }
        
        .modal-overlay { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-content { transform: scale(0.95); transition: transform 0.3s ease; }
        .modal-overlay.open .modal-content { transform: scale(1); }

        /* Nút chọn biến thể sản phẩm */
        .variant-btn { border: 1px solid #e5e0d8; background: white; color: #737373; transition: all 0.2s; }
        .variant-btn:hover { border-color: #1a1a1a; color: #1a1a1a; }
        .variant-btn.active { background: #1a1a1a; color: white; border-color: #1a1a1a; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="antialiased min-h-screen pb-20">

    <header class="w-full border-b border-gray-300 py-6 px-10 sticky top-0 bg-[#F5F4F0] z-40 flex justify-between items-center">
        <div class="text-4xl serif tracking-widest cursor-pointer" onclick="quickSearch('')">AHAHA</div>
        <nav class="hidden md:flex space-x-10 text-xs tracking-widest uppercase text-gray-500">
            <a href="#" class="hover:text-black">Cửa hàng</a>
            <a href="#" class="hover:text-black">Chất liệu</a>
            <a href="#" class="hover:text-black cursor-pointer" onclick="openOrdersModal()">Đơn hàng</a>
        </nav>
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-3">
                <span class="text-xs tracking-wider uppercase text-gray-400 font-medium">Cơ bản</span>
                <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="rmn-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out"/>
                    <label for="rmn-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                </div>
                <span class="text-xs tracking-wider uppercase text-gray-900 font-bold">Chế độ RMN</span>
            </div>
            <button onclick="toggleCart()" class="relative cursor-pointer text-xl">
                🛒
                <span id="cart-badge" class="absolute -top-2 -right-2 bg-black text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full">0</span>
            </button>
        </div>
    </header>

    <!-- Banner Quảng Cáo -->
    <div id="video-banner-son" class="hero-banner cursor-pointer" onclick="openSponsoredProduct('son')">
        <video autoplay muted loop playsinline class="w-full h-full object-cover pointer-events-none">
            <source src="video-dior.mp4" type="video/mp4">
        </video>
        <div class="absolute bottom-10 left-10 text-white p-6 z-10" style="background: rgba(0,0,0,0.4);">
            <div class="text-xs tracking-widest uppercase mb-2 border border-white inline-block px-2 py-1">Nội dung tài trợ</div>
            <h2 class="text-5xl serif mb-2">Dior Addict Lip Glow</h2>
            <p class="text-sm underline mt-2">Bấm để mua ngay</p>
        </div>
    </div>

    <div id="video-banner-ao" class="hero-banner cursor-pointer" onclick="openSponsoredProduct('ao')">
        <video autoplay muted loop playsinline class="w-full h-full object-cover pointer-events-none">
            <source src="video-adidas.mp4" type="video/mp4">
        </video>
        <div class="absolute bottom-10 left-10 text-white p-6 z-10" style="background: rgba(0,0,0,0.4);">
            <div class="text-xs tracking-widest uppercase mb-2 border border-white inline-block px-2 py-1">Nội dung tài trợ</div>
            <h2 class="text-5xl serif mb-2">Bộ Sưu Tập Adidas</h2>
            <p class="text-sm underline mt-2">Bấm để mua ngay</p>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-6 mt-10">
        <div class="mb-10 text-center">
            <input type="text" id="search-input" placeholder="Tìm kiếm 'son' hoặc 'áo thun'..." 
                class="w-full max-w-2xl bg-transparent border-b border-gray-400 py-3 px-4 text-xl serif focus:outline-none focus:border-black transition-colors">
            <div class="mt-4 text-sm text-gray-500">
                Gợi ý: <span class="cursor-pointer hover:text-black underline" onclick="quickSearch('son')">Son môi</span>, 
                <span class="cursor-pointer hover:text-black underline" onclick="quickSearch('áo')">Áo thun</span>
            </div>
        </div>

        <div class="flex justify-between items-end mb-6">
            <h3 class="text-xl serif italic" id="search-result-text">Tất cả sản phẩm</h3>
            <span class="text-xs tracking-widest text-gray-500" id="item-count">60 SẢN PHẨM</span>
        </div>

        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8"></div>
    </main>

    <!-- CHI TIẾT SẢN PHẨM (MODAL) CÓ NÚT PHÂN LOẠI -->
    <div id="product-modal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 backdrop-blur-sm">
        <div class="modal-content bg-white w-full max-w-4xl max-h-[90vh] overflow-y-auto flex flex-col md:flex-row relative">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 text-2xl text-gray-500 hover:text-black z-10">&times;</button>
            <div class="w-full md:w-1/2 bg-[#eae8e3] flex items-center justify-center p-8">
                <img id="modal-img" src="" alt="Hình ảnh sản phẩm" class="max-h-[60vh] w-full object-contain mix-blend-multiply" style="display: block;">
            </div>
            <div class="w-full md:w-1/2 p-10 flex flex-col justify-center">
                <p id="modal-brand" class="text-xs tracking-widest text-gray-500 uppercase mb-2"></p>
                <h2 id="modal-name" class="text-3xl serif mb-4 text-gray-900 leading-tight"></h2>
                <p id="modal-price" class="text-xl mb-4 font-medium"></p>
                
                <div class="mb-8 h-px bg-gray-200 w-full"></div>
                
                <!-- Khu vực chứa các nút chọn phân loại -->
                <div id="modal-variants" class="mb-8"></div>
                
                <button id="modal-add-btn" class="w-full bg-black text-white uppercase tracking-widest text-sm py-4 hover:bg-gray-800 transition shadow-md">Thêm vào giỏ hàng</button>
            </div>
        </div>
    </div>

    <!-- GIỎ HÀNG SIDEBAR -->
    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-[400px] bg-white z-50 shadow-2xl flex flex-col border-l border-gray-200">
        <div class="p-6 border-b border-gray-200 flex justify-between items-center bg-[#F5F4F0]">
            <h2 class="text-xl serif">Giỏ hàng của bạn</h2>
            <button onclick="toggleCart()" class="text-2xl text-gray-500 hover:text-black">&times;</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-6"></div>
        <div class="p-6 border-t border-gray-200 bg-gray-50">
            <div class="flex justify-between items-center mb-4">
                <span class="text-sm uppercase tracking-widest text-gray-500">Tổng cộng</span>
                <span id="cart-total" class="text-xl font-bold">0 đ</span>
            </div>
            <button onclick="checkout()" class="w-full bg-black text-white uppercase tracking-widest text-sm py-4 hover:bg-gray-800 transition">Thanh toán ngay</button>
        </div>
    </div>

    <!-- THEO DÕI ĐƠN HÀNG (MODAL) -->
    <div id="orders-modal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 backdrop-blur-sm">
        <div class="modal-content bg-[#F5F4F0] w-full max-w-2xl max-h-[80vh] overflow-y-auto relative p-8">
            <button onclick="closeOrdersModal()" class="absolute top-4 right-4 text-2xl text-gray-500 hover:text-black z-10">&times;</button>
            <h2 class="text-3xl serif mb-6 text-center border-b border-gray-300 pb-4">Đơn hàng của bạn</h2>
            <div id="orders-list" class="space-y-4">
                <p class="text-center text-gray-500 text-sm py-10">Bạn chưa có đơn hàng nào.</p>
            </div>
        </div>
    </div>

    <script>
        const products = [];
        let cart = [];
        let orders = [];
        let currentVariant = '';
        
        const sonFiles = ['Chanel_Premier_velvet_IS334.jpg', 'Dior_velvetSatin_collection_IS334.jpg', 'LSY_Velvet_Collection_IS334.jpg', 'MAC_MACXIMAL_velvet_teddy_IS334.jpg', 'Romand_velvet_collection.jpg', 'Son_duong_Dior_Addict_Lip_Glow_Oiljpg.jpg', 'TOMFORD_velvet_collection_IS334.jpg'];
        const aoFiles = ['Adidas_tee_collection_IS334.jpg', 'H&M_tee_collection_IS334.jpg', 'Levi\'s_tee_collection_IS334.jpg', 'Puma_tee_collection_IS334.jpg', 'Uniqlo_tee_collection_IS334.jpg', 'Zara_tee_collection_IS334.jpg'];

        const colors = ['Đỏ lạnh', 'Hồng san hô', 'Cam đất', 'Đỏ rượu'];
        const sizes = ['S', 'M', 'L', 'XL'];

        for(let i=0; i<30; i++) {
            let file = sonFiles[i % sonFiles.length];
            let brand = file.split('_')[0]; 
            if(file === 'Son_duong_Dior_Addict_Lip_Glow_Oiljpg.jpg') brand = 'Dior';
            let priceNum = 500000 + (i * 20000);
            
            products.push({
                id: 'son' + i, type: 'son', brand: brand,
                name: `Bộ sưu tập son ${brand} ${i+1}`,
                priceNum: priceNum, price: priceNum.toLocaleString('vi-VN') + ' đ',
                image: file, variants: colors, variantLabel: 'Màu sắc'
            });
        }

        for(let i=0; i<30; i++) {
            let file = aoFiles[i % aoFiles.length];
            let brand = file.split('_')[0];
            let priceNum = 300000 + (i * 15000);
            
            products.push({
                id: 'ao' + i, type: 'ao', brand: brand,
                name: `Bộ sưu tập áo thun ${brand} ${i+1}`,
                priceNum: priceNum, price: priceNum.toLocaleString('vi-VN') + ' đ',
                image: file, variants: sizes, variantLabel: 'Kích cỡ'
            });
        }

        const grid = document.getElementById('product-grid');
        const searchInput = document.getElementById('search-input');
        const toggleRMN = document.getElementById('rmn-toggle');
        const bannerSon = document.getElementById('video-banner-son');
        const bannerAo = document.getElementById('video-banner-ao');
        const resultText = document.getElementById('search-result-text');

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function renderProducts(list, isRMN = false, queryType = '') {
            grid.innerHTML = '';
            list.forEach((p, index) => {
                let isSponsored = false;
                if(isRMN && index < 6) {
                    if(queryType === 'son' && p.image === 'Son_duong_Dior_Addict_Lip_Glow_Oiljpg.jpg') isSponsored = true;
                    if(queryType === 'ao' && p.brand === 'Adidas') isSponsored = true;
                }
                const html = `
                    <div class="product-card relative group" onclick="openProductModal('${p.id}')">
                        ${isSponsored ? '<div class="sponsored-badge z-10">Tài trợ</div>' : ''}
                        <div class="w-full aspect-square bg-[#eae8e3] mb-4 overflow-hidden flex items-center justify-center">
                            <img src="${p.image}" class="w-full h-full object-cover mix-blend-multiply transition duration-500 group-hover:scale-105" onerror="this.style.display='none'">
                        </div>
                        <div class="flex-1 flex flex-col justify-between">
                            <div>
                                <p class="text-[0.65rem] tracking-widest text-gray-500 uppercase mb-1">${p.brand}</p>
                                <h4 class="text-sm serif mb-2 text-gray-900 leading-relaxed">${p.name}</h4>
                            </div>
                            <div class="mt-4"><span class="text-sm">${p.price}</span></div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', html);
            });
        }

        function performSearch() {
            const query = searchInput.value.toLowerCase().trim();
            const rmnActive = toggleRMN.checked;
            
            let filtered = products;
            let queryType = '';
            
            if(query.includes('son')) {
                filtered = products.filter(p => p.type === 'son');
                queryType = 'son';
                resultText.innerText = 'Tìm kiếm: "son"';
            } else if (query.includes('áo') || query.includes('ao')) {
                filtered = products.filter(p => p.type === 'ao');
                queryType = 'ao';
                resultText.innerText = 'Tìm kiếm: "áo thun"';
            } else {
                resultText.innerText = 'Tất cả sản phẩm';
            }

            bannerSon.classList.remove('active');
            bannerAo.classList.remove('active');

            if(rmnActive && queryType !== '') {
                let sponsored = []; let normal = [];
                if(queryType === 'son') {
                    bannerSon.classList.add('active');
                    sponsored = filtered.filter(p => p.image === 'Son_duong_Dior_Addict_Lip_Glow_Oiljpg.jpg').slice(0, 6);
                } else if (queryType === 'ao') {
                    bannerAo.classList.add('active');
                    sponsored = filtered.filter(p => p.brand === 'Adidas').slice(0, 6);
                }
                normal = filtered.filter(p => !sponsored.includes(p));
                renderProducts([...sponsored, ...shuffleArray(normal)], true, queryType);
            } else {
                renderProducts(shuffleArray(filtered), false);
            }
        }

        function quickSearch(keyword) { searchInput.value = keyword; performSearch(); }
        function openSponsoredProduct(type) {
            let p = (type === 'son') ? products.find(p => p.image === 'Son_duong_Dior_Addict_Lip_Glow_Oiljpg.jpg') : products.find(p => p.brand === 'Adidas');
            if (p) openProductModal(p.id);
        }

        // CHỌN PHÂN LOẠI
        function setVariant(btn, variantVal) {
            const btns = document.querySelectorAll('.variant-btn');
            btns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentVariant = variantVal;
            document.getElementById('current-variant-text').innerText = variantVal;
        }

        const productModal = document.getElementById('product-modal');
        function openProductModal(id) {
            const product = products.find(p => p.id === id);
            if(product) {
                document.getElementById('modal-img').src = product.image;
                document.getElementById('modal-brand').innerText = product.brand;
                document.getElementById('modal-name').innerText = product.name;
                document.getElementById('modal-price').innerText = product.price;
                
                // Mặc định chọn cái đầu tiên
                currentVariant = product.variants[0]; 
                
                // Render Nút bấm phân loại
                let vHtml = `
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-xs uppercase tracking-widest text-stone-500 font-medium">${product.variantLabel}</label>
                        <span id="current-variant-text" class="text-xs text-stone-900 font-medium">${currentVariant}</span>
                    </div>
                    <div class="flex flex-wrap gap-3">
                `;
                product.variants.forEach(v => {
                    let activeClass = (v === currentVariant) ? 'active' : '';
                    vHtml += `<button class="variant-btn px-5 py-2.5 text-sm font-light rounded-sm ${activeClass}" onclick="setVariant(this, '${v}')">${v}</button>`;
                });
                vHtml += '</div>';
                document.getElementById('modal-variants').innerHTML = vHtml;
                
                document.getElementById('modal-add-btn').onclick = function() {
                    addToCart(product.id, currentVariant);
                    closeProductModal();
                    toggleCart(true); 
                };
                productModal.classList.add('open');
            }
        }
        function closeProductModal() { productModal.classList.remove('open'); }

        const cartSidebar = document.getElementById('cart-sidebar');
        function toggleCart(forceOpen = false) {
            if(forceOpen === true) cartSidebar.classList.add('open');
            else cartSidebar.classList.toggle('open');
            renderCart();
        }

        function addToCart(id, variant) {
            const product = products.find(p => p.id === id);
            if(product) {
                // Phân biệt sản phẩm bằng id + variant
                let cartId = id + '-' + variant;
                const existing = cart.find(item => item.cartId === cartId);
                if(existing) existing.quantity += 1;
                else cart.push({ ...product, cartId: cartId, variant: variant, quantity: 1 });
                updateCartBadge();
            }
        }

        function removeFromCart(cartId) {
            cart = cart.filter(item => item.cartId !== cartId);
            updateCartBadge(); renderCart();
        }

        function updateCartBadge() {
            document.getElementById('cart-badge').innerText = cart.reduce((sum, item) => sum + item.quantity, 0);
        }

        function renderCart() {
            const cartItemsContainer = document.getElementById('cart-items');
            cartItemsContainer.innerHTML = '';
            if(cart.length === 0) {
                cartItemsContainer.innerHTML = '<p class="text-center text-gray-500 mt-10 text-sm">Giỏ hàng của bạn đang trống.</p>';
                document.getElementById('cart-total').innerText = '0 đ';
                return;
            }
            let totalPrice = 0;
            cart.forEach(item => {
                totalPrice += item.priceNum * item.quantity;
                const html = `
                    <div class="flex items-center gap-4 bg-white p-3 border border-gray-100 shadow-sm">
                        <img src="${item.image}" class="w-16 h-16 object-cover bg-[#eae8e3]" style="display:block;">
                        <div class="flex-1">
                            <h4 class="text-xs serif mb-1 font-bold">${item.name}</h4>
                            <p class="text-[0.65rem] text-stone-500 mb-1 border border-stone-200 inline-block px-1 mb-1">${item.variantLabel}: ${item.variant}</p>
                            <p class="text-xs text-gray-500 mb-1">${item.price} x ${item.quantity}</p>
                        </div>
                        <button onclick="removeFromCart('${item.cartId}')" class="text-gray-400 hover:text-red-500 text-xl">&times;</button>
                    </div>
                `;
                cartItemsContainer.insertAdjacentHTML('beforeend', html);
            });
            document.getElementById('cart-total').innerText = totalPrice.toLocaleString('vi-VN') + ' đ';
        }

        const ordersModal = document.getElementById('orders-modal');
        function openOrdersModal() { toggleCart(false); renderOrders(); ordersModal.classList.add('open'); }
        function closeOrdersModal() { ordersModal.classList.remove('open'); }

        function checkout() {
            if(cart.length === 0) { alert("Bạn chưa có sản phẩm nào để thanh toán!"); return; }
            const total = cart.reduce((sum, item) => sum + item.priceNum * item.quantity, 0);
            const orderId = 'ORD-' + Math.floor(Math.random() * 100000);
            orders.unshift({
                id: orderId, date: new Date().toLocaleDateString('vi-VN'), total: total.toLocaleString('vi-VN') + ' đ',
                status: 'Đang xử lý', items: [...cart]
            });
            cart = []; updateCartBadge(); toggleCart(false); 
            alert(`Thanh toán thành công! Mã đơn: ${orderId}`); openOrdersModal();
        }

        function renderOrders() {
            const list = document.getElementById('orders-list');
            list.innerHTML = '';
            if(orders.length === 0) {
                list.innerHTML = '<p class="text-center text-gray-500 text-sm py-10">Bạn chưa có đơn hàng nào.</p>'; return;
            }
            orders.forEach(o => {
                let itemsHtml = o.items.map(i => `<span class="text-[10px] bg-gray-200 px-2 py-1 mr-1 mb-1 inline-block">${i.name} - ${i.variant} (x${i.quantity})</span>`).join('');
                list.insertAdjacentHTML('beforeend', `
                    <div class="bg-white p-6 border border-gray-200 shadow-sm flex flex-col md:flex-row justify-between gap-4">
                        <div>
                            <div class="flex items-center gap-3 mb-2">
                                <h4 class="font-bold text-lg">${o.id}</h4>
                                <span class="bg-black text-white text-[10px] uppercase tracking-widest px-2 py-1">${o.status}</span>
                            </div>
                            <p class="text-xs text-gray-500 mb-3">Ngày đặt: ${o.date}</p>
                            <div>${itemsHtml}</div>
                        </div>
                        <div class="text-right flex flex-col justify-center">
                            <p class="text-xs uppercase tracking-widest text-gray-500 mb-1">Tổng cộng</p>
                            <p class="text-xl serif">${o.total}</p>
                        </div>
                    </div>
                `);
            });
        }

        searchInput.addEventListener('input', performSearch);
        toggleRMN.addEventListener('change', performSearch);
        renderProducts(shuffleArray(products), false);
    </script>
</body>
</html>
